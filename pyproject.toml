[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metajailbreak-vlm"
version = "0.1.0"
description = "Multimodal safety evaluation and reflective optimization toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
metajailbreak = "metajailbreak_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
